<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><link rel="manifest" href="./manifest.webmanifest">
<title>Mesário COPA CAP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#102a43}header{background:#102a43;color:white;padding:14px 16px;position:sticky;top:0;z-index:5}header h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:1000px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.hidden{display:none}.btn,button{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#1261a0;color:white}.green{background:#16834b;color:white}.amber{background:#e6a700;color:#17202a}.red{background:#c93636;color:white}.light{background:#e7edf4;color:#102a43}.purple{background:#7146a5;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.team{font-weight:800;font-size:18px}.placar{font-size:32px;font-weight:900}.timer{text-align:center;font-size:42px;font-weight:900;margin:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;border-bottom:1px solid #dde5ed;padding:8px 0}.player input{width:60px;padding:9px}.player small{display:block;color:#52606d}.event{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #e6edf3;padding:8px 0}select,input,textarea{width:100%;padding:11px;border:1px solid #bcccdc;border-radius:9px;font-size:16px}label{display:block;font-weight:700;margin:9px 0 5px}.notice{background:#e8f2fb;padding:10px;border-radius:9px;margin:8px 0}.danger-note{background:#fff1f1;padding:10px;border-radius:9px}.eventbuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.eventbuttons button{min-height:52px}@media(max-width:720px){.grid{grid-template-columns:1fr}.team{font-size:15px}.placar{font-size:26px}.timer{font-size:38px}}
</style></head>
<body><header><h1>Mesário COPA CAP</h1><small>V0.1 • Offline</small></header><main class="wrap">
<section id="entrada" class="card"><h2>Carregar partida</h2><p>Selecione o arquivo JSON exportado pelo Gestor de Campeonatos.</p><input id="arquivo" type="file" accept=".json,application/json"><div class="actions" style="margin-top:10px"><button class="primary" onclick="carregarArquivo()">Abrir partida</button><button class="light" onclick="restaurar()">Restaurar partida salva</button></div><div class="notice">Os registros ficam salvos neste aparelho durante o jogo.</div></section>
<section id="app" class="hidden">
<div class="card"><div id="meta"></div><div class="score"><div class="team" id="casaNome"></div><div class="placar"><span id="pc">0</span> x <span id="pf">0</span></div><div class="team" id="foraNome"></div></div>
<div class="timer" id="timer">00:00</div><div class="actions" style="justify-content:center"><button class="green" onclick="iniciar()">Iniciar</button><button class="amber" onclick="pausar()">Pausar</button><button class="light" onclick="zerar()">Zerar</button></div></div>
<div class="grid"><div class="card"><h2 id="hc"></h2><div id="lc"></div><div id="ec"></div></div><div class="card"><h2 id="hf"></h2><div id="lf"></div><div id="ef"></div></div></div>
<div class="card"><h2>Responsáveis e observações</h2><div class="grid"><div><label>Árbitro</label><input id="arb" oninput="salvarCampos()"><label>Mesário</label><input id="mes" oninput="salvarCampos()"></div><div><label id="lrc">Responsável mandante</label><input id="rc" oninput="salvarCampos()"><label id="lrf">Responsável visitante</label><input id="rf" oninput="salvarCampos()"></div></div><label>Ocorrências / observações</label><textarea id="obs" rows="4" oninput="salvarCampos()"></textarea></div>
<div class="card"><div class="danger-note">Antes de finalizar, confira placar, gols, cartões e responsáveis.</div><div class="actions" style="margin-top:10px"><button class="green" onclick="finalizar()">Encerrar e exportar retorno</button><button class="primary" onclick="exportar(false)">Exportar parcial</button><button class="red" onclick="limparTudo()">Apagar partida deste aparelho</button></div></div>
</section></main>
<script>
const KEY="copaCapMesarioV01";let pacote=null,cronInt=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function dataBR(v){if(!v)return "-";let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:v}
function salvar(){if(pacote)localStorage.setItem(KEY,JSON.stringify(pacote))}
async function carregarArquivo(){let f=$("arquivo").files[0];if(!f)return alert("Selecione o arquivo da partida.");let x;try{x=JSON.parse(await f.text())}catch{return alert("Arquivo inválido.")}if(x.schema!=="copa-cap-mesario-v1"||!x.jogo?.id)return alert("Este arquivo não é um pacote válido do Gestor.");pacote=x;preparar();salvar();render()}
function restaurar(){try{pacote=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}if(!pacote)return alert("Nenhuma partida salva neste aparelho.");preparar();render()}
function preparar(){let j=pacote.jogo;j.gols=Array.isArray(j.gols)?j.gols:[];j.cartoes=Array.isArray(j.cartoes)?j.cartoes:[];j.responsaveisSumula=j.responsaveisSumula||{};j.cronometro=j.cronometro||{segundos:0,rodando:false,inicioTimestamp:null};["casa","fora"].forEach(l=>(j[l].atletas||[]).forEach(a=>{a.numero=String(a.numero||"")}));$("entrada").classList.add("hidden");$("app").classList.remove("hidden");if(j.cronometro.rodando)rodarIntervalo()}
function segAtual(){let c=pacote.jogo.cronometro;return (c.segundos||0)+(c.rodando&&c.inicioTimestamp?Math.max(0,Math.floor((Date.now()-c.inicioTimestamp)/1000)):0)}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function minuto(){return Math.max(1,Math.floor(segAtual()/60)+1)}
function iniciar(){let c=pacote.jogo.cronometro;if(!c.rodando){c.rodando=true;c.inicioTimestamp=Date.now();salvar()}rodarIntervalo()}
function rodarIntervalo(){clearInterval(cronInt);cronInt=setInterval(()=>$("timer").textContent=fmt(segAtual()),1000)}
function pausar(){let c=pacote.jogo.cronometro;if(c.rodando){c.segundos=segAtual();c.rodando=false;c.inicioTimestamp=null;salvar()}clearInterval(cronInt);renderTopo()}
function zerar(){if(!confirm("Zerar o cronômetro?"))return;pacote.jogo.cronometro={segundos:0,rodando:false,inicioTimestamp:null};clearInterval(cronInt);salvar();renderTopo()}
function atletaPorId(id){for(let l of ["casa","fora"]){let a=pacote.jogo[l].atletas.find(x=>x.id===id);if(a)return a}}
function timeId(l){return pacote.jogo[l].timeId}
function mudarNumero(id,v){let a=atletaPorId(id);if(a){a.numero=String(v||"").trim();salvar();renderEventos()}}
function addGol(l){let id=$("gol_"+l).value,a=atletaPorId(id);if(!a)return alert("Selecione o atleta.");if(!a.numero)return alert("Informe o número da camisa.");pacote.jogo.gols.push({atletaId:a.id,atleta:a.nome,numero:a.numero,timeId:timeId(l),minuto:minuto()});replacar();salvar();render()}
function addCartao(l,tipo){let id=$("car_"+l).value,a=atletaPorId(id);if(!a)return alert("Selecione o atleta.");if(!a.numero)return alert("Informe o número da camisa.");pacote.jogo.cartoes.push({atletaId:a.id,atleta:a.nome,numero:a.numero,timeId:timeId(l),tipo,minuto:minuto()});salvar();renderEventos()}
function replacar(){let j=pacote.jogo;j.placarCasa=j.gols.filter(g=>g.timeId===j.casa.timeId).length;j.placarFora=j.gols.filter(g=>g.timeId===j.fora.timeId).length}
function excluirEvento(tipo,i){if(!confirm("Excluir este registro?"))return;pacote.jogo[tipo].splice(i,1);if(tipo==="gols")replacar();salvar();render()}
function lista(l){let a=pacote.jogo[l].atletas||[];return a.map(x=>`<div class="player"><input type="number" inputmode="numeric" min="0" placeholder="Nº" value="${esc(x.numero)}" onchange="mudarNumero('${x.id}',this.value)"><div><strong>${esc(x.nome)}</strong><small>Nasc.: ${esc(dataBR(x.nascimento))}</small></div></div>`).join("")||"<p>Sem atletas.</p>"}
function opts(l){return `<option value="">Selecione...</option>`+(pacote.jogo[l].atletas||[]).slice().sort((a,b)=>(+a.numero||999)-(+b.numero||999)||a.nome.localeCompare(b.nome)).map(a=>`<option value="${a.id}">${a.numero?"#"+esc(a.numero)+" — ":""}${esc(a.nome)}</option>`).join("")}
function painelEventos(l){let j=pacote.jogo,tid=timeId(l);let gs=j.gols.map((g,i)=>({...g,i})).filter(g=>g.timeId===tid),cs=j.cartoes.map((c,i)=>({...c,i})).filter(c=>c.timeId===tid);return `<hr><h3>Gol</h3><select id="gol_${l}">${opts(l)}</select><button class="green" style="width:100%;margin-top:7px" onclick="addGol('${l}')">+ Registrar gol</button><h3>Cartão</h3><select id="car_${l}">${opts(l)}</select><div class="eventbuttons" style="margin-top:7px"><button class="amber" onclick="addCartao('${l}','Amarelo')">Amarelo</button><button class="red" onclick="addCartao('${l}','Vermelho')">Vermelho</button></div><h3>Registros</h3>${gs.map(g=>`<div class="event"><span>⚽ #${esc(g.numero)} ${esc(g.atleta)} — ${g.minuto}'</span><button class="red" onclick="excluirEvento('gols',${g.i})">X</button></div>`).join("")}${cs.map(c=>`<div class="event"><span>${c.tipo==="Vermelho"?"🟥":"🟨"} #${esc(c.numero)} ${esc(c.atleta)} — ${c.minuto}'</span><button class="red" onclick="excluirEvento('cartoes',${c.i})">X</button></div>`).join("")||(!gs.length?"<small>Nenhum registro.</small>":"")}`}
function renderTopo(){let j=pacote.jogo;$("meta").innerHTML=`<strong>${esc(pacote.campeonato?.nome||"Campeonato")}</strong><br>${esc(j.categoria)} • ${esc(j.rodada||"")} • ${esc(dataBR(j.data))} ${esc(j.hora||"")}<br>${esc(j.local?.nome||"")}`;$("casaNome").textContent=j.casa.nome;$("foraNome").textContent=j.fora.nome;$("pc").textContent=j.placarCasa||0;$("pf").textContent=j.placarFora||0;$("timer").textContent=fmt(segAtual())}
function renderEventos(){$("ec").innerHTML=painelEventos("casa");$("ef").innerHTML=painelEventos("fora")}
function render(){let j=pacote.jogo;renderTopo();$("hc").textContent=j.casa.nome;$("hf").textContent=j.fora.nome;$("lc").innerHTML=lista("casa");$("lf").innerHTML=lista("fora");renderEventos();$("arb").value=j.responsaveisSumula.arbitro||"";$("mes").value=j.responsaveisSumula.mesario||"";$("rc").value=j.responsaveisSumula.responsavelCasa||"";$("rf").value=j.responsaveisSumula.responsavelFora||"";$("obs").value=j.observacoes||"";$("lrc").textContent="Responsável — "+j.casa.nome;$("lrf").textContent="Responsável — "+j.fora.nome}
function salvarCampos(){let r=pacote.jogo.responsaveisSumula;r.arbitro=$("arb").value;r.mesario=$("mes").value;r.responsavelCasa=$("rc").value;r.responsavelFora=$("rf").value;pacote.jogo.observacoes=$("obs").value;salvar()}
function baixar(obj,nome){let b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportar(encerrar){salvarCampos();pausar();let j=pacote.jogo;if(encerrar){j.status="Encerrado";j.encerradoEm=new Date().toISOString()}salvar();baixar(pacote,`retorno-mesario-${j.casa.nome}-x-${j.fora.nome}.json`)}
function finalizar(){if(!confirm("Encerrar a partida e gerar o arquivo para retornar ao Gestor?"))return;exportar(true)}
function limparTudo(){if(!confirm("Apagar a partida salva neste aparelho?"))return;localStorage.removeItem(KEY);location.reload()}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
