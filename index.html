<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43"><link rel="manifest" href="./manifest.webmanifest">
<title>Mesário COPA CAP</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#102a43}header{background:#102a43;color:white;padding:14px 16px;position:sticky;top:0;z-index:5}header h1{font-size:20px;margin:0}header small{opacity:.85}.wrap{max-width:1000px;margin:auto;padding:12px}.card{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.hidden{display:none}.btn,button{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#1261a0;color:white}.green{background:#16834b;color:white}.amber{background:#e6a700;color:#17202a}.red{background:#c93636;color:white}.light{background:#e7edf4;color:#102a43}.purple{background:#7146a5;color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}.team{font-weight:800;font-size:18px}.placar{font-size:32px;font-weight:900}.timer{text-align:center;font-size:42px;font-weight:900;margin:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{display:grid;grid-template-columns:64px 1fr;gap:8px;align-items:center;border-bottom:1px solid #dde5ed;padding:8px 0}.player input{width:60px;padding:9px}.player small{display:block;color:#52606d}.event{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid #e6edf3;padding:8px 0}select,input,textarea{width:100%;padding:11px;border:1px solid #bcccdc;border-radius:9px;font-size:16px}label{display:block;font-weight:700;margin:9px 0 5px}.notice{background:#e8f2fb;padding:10px;border-radius:9px;margin:8px 0}.danger-note{background:#fff1f1;padding:10px;border-radius:9px}.eventbuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.eventbuttons button{min-height:52px}@media(max-width:720px){.grid{grid-template-columns:1fr}.team{font-size:15px}.placar{font-size:26px}.timer{font-size:38px}}
</style><style>
.modal-edit-bg{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-edit{background:#fff;width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:20px;box-sizing:border-box;color:#17212b}
.modal-edit label{display:block;font-weight:700;margin-top:10px}.modal-edit select,.modal-edit input,.modal-edit textarea{width:100%;box-sizing:border-box;margin-top:5px}
</style></head>
<body><header><h1>Mesário COPA CAP</h1><small>V0.5.1 • Offline</small></header><main class="wrap">
<section id="entrada" class="card"><h2>Carregar partida</h2><p>Selecione o arquivo JSON exportado pelo Gestor de Campeonatos.</p><input id="arquivo" type="file" accept=".json,application/json"><div class="actions" style="margin-top:10px"><button class="primary" onclick="carregarArquivo()">Abrir partida</button><button class="light" onclick="restaurar()">Restaurar partida salva</button></div><div class="notice">Os registros ficam salvos neste aparelho durante o jogo.</div></section>
<section id="app" class="hidden">
<div class="card"><div id="meta"></div><div class="score"><div class="team" id="casaNome"></div><div class="placar"><span id="pc">0</span> x <span id="pf">0</span></div><div class="team" id="foraNome"></div></div>
<div style="text-align:center;font-weight:800" id="periodo">1º Tempo</div><div class="timer" id="timer">00:00</div><div class="actions" style="justify-content:center"><button class="green" onclick="iniciar()">Iniciar</button><button class="amber" onclick="pausar()">Pausar</button><button class="light" onclick="zerar()">Zerar</button><button class="purple" id="btnPeriodo" onclick="avancarPeriodo()">Encerrar 1º Tempo</button></div></div>
<div class="grid"><div class="card"><h2 id="hc"></h2><div id="lc"></div><div id="ec"></div></div><div class="card"><h2 id="hf"></h2><div id="lf"></div><div id="ef"></div></div></div>
<div class="card" id="decisaoArea"></div><div class="card"><h2>Responsáveis e observações</h2><div class="grid"><div><label>Árbitro</label><input id="arb" oninput="salvarCampos()"><label>Mesário</label><input id="mes" oninput="salvarCampos()"></div><div><label id="lrc">Responsável mandante</label><input id="rc" oninput="salvarCampos()"><label id="lrf">Responsável visitante</label><input id="rf" oninput="salvarCampos()"></div></div><label>Ocorrências / observações</label><textarea id="obs" rows="4" oninput="salvarCampos()"></textarea></div>
<div class="card"><div class="danger-note">Antes de finalizar, confira placar, gols, cartões e responsáveis.</div><div class="actions" style="margin-top:10px"><button class="green" onclick="finalizar()">Encerrar e exportar retorno</button><button class="primary" onclick="exportar(false)">Exportar parcial</button><button class="red" onclick="limparTudo()">Apagar partida deste aparelho</button></div></div>
</section></main>
<script>
const KEY="copaCapMesarioV01";let pacote=null,cronInt=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function dataBR(v){if(!v)return "-";let m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}/${m[2]}/${m[1]}`:v}
function salvar(){if(pacote)localStorage.setItem(KEY,JSON.stringify(pacote))}
async function carregarArquivo(){let f=$("arquivo").files[0];if(!f)return alert("Selecione o arquivo da partida.");let x;try{x=JSON.parse(await f.text())}catch{return alert("Arquivo inválido.")}if(x.schema!=="copa-cap-mesario-v1"||!x.jogo?.id)return alert("Este arquivo não é um pacote válido do Gestor.");pacote=x;preparar();salvar();render()}
function restaurar(){try{pacote=JSON.parse(localStorage.getItem(KEY)||"null")}catch{}if(!pacote)return alert("Nenhuma partida salva neste aparelho.");preparar();render()}
function preparar(){let j=pacote.jogo;j.gols=Array.isArray(j.gols)?j.gols:[];j.cartoes=Array.isArray(j.cartoes)?j.cartoes:[];j.responsaveisSumula=j.responsaveisSumula||{};j.periodoAtual=j.periodoAtual||"1T";if(!j.cronometros){let antigo=j.cronometro||{segundos:0,rodando:false,inicioTimestamp:null};j.cronometros={"1T":antigo,"2T":{segundos:0,rodando:false,inicioTimestamp:null}}}j.cronometro=j.cronometros[j.periodoAtual];["casa","fora"].forEach(l=>(j[l].atletas||[]).forEach(a=>{a.numero=String(a.numero||"")}));$("entrada").classList.add("hidden");$("app").classList.remove("hidden");if(j.cronometros[j.periodoAtual].rodando)rodarIntervalo()}
function cAtual(){let j=pacote.jogo;return j.cronometros[j.periodoAtual]}
function segAtual(){let c=cAtual();return (c.segundos||0)+(c.rodando&&c.inicioTimestamp?Math.max(0,Math.floor((Date.now()-c.inicioTimestamp)/1000)):0)}
function fmt(s){return `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
function minuto(){return Math.max(1,Math.floor(segAtual()/60)+1)}
function periodoTxt(){return pacote.jogo.periodoAtual==="2T"?"2º Tempo":"1º Tempo"}
function iniciar(){let c=cAtual();if(!c.rodando){c.rodando=true;c.inicioTimestamp=Date.now();pacote.jogo.cronometro=c;salvar()}rodarIntervalo()}
function rodarIntervalo(){clearInterval(cronInt);cronInt=setInterval(()=>$("timer").textContent=fmt(segAtual()),1000)}
function pausar(){let c=cAtual();if(c.rodando){c.segundos=segAtual();c.rodando=false;c.inicioTimestamp=null;pacote.jogo.cronometro=c;salvar()}clearInterval(cronInt);renderTopo()}
function zerar(){if(!confirm(`Zerar o cronômetro do ${periodoTxt()}?`))return;let j=pacote.jogo;j.cronometros[j.periodoAtual]={segundos:0,rodando:false,inicioTimestamp:null};j.cronometro=j.cronometros[j.periodoAtual];clearInterval(cronInt);salvar();renderTopo()}
function avancarPeriodo(){let j=pacote.jogo;if(j.periodoAtual==="1T"){if(!confirm("Encerrar o 1º tempo?"))return;pausar();j.primeiroTempoEncerrado=true;j.periodoAtual="2T";j.cronometro=j.cronometros["2T"];salvar();render()}else alert("A partida já está no 2º tempo.")}
function atletaPorId(id){for(let l of ["casa","fora"]){let a=pacote.jogo[l].atletas.find(x=>x.id===id);if(a)return a}}
function timeId(l){return pacote.jogo[l].timeId}
function mudarNumero(id,v){let a=atletaPorId(id);if(a){a.numero=String(v||"").trim();salvar();renderEventos()}}
function addGol(l){let id=$("gol_"+l).value;if(!id)return alert("Selecione o atleta ou GOL CONTRA.");if(id==="__GOL_CONTRA__"){pacote.jogo.gols.push({golContra:true,atletaId:null,atleta:"Gol contra",numero:"",timeId:timeId(l),minuto:minuto(),periodo:pacote.jogo.periodoAtual});}else{let a=atletaPorId(id);if(!a)return alert("Selecione o atleta.");if(!a.numero)return alert("Informe o número da camisa.");pacote.jogo.gols.push({golContra:false,atletaId:a.id,atleta:a.nome,numero:a.numero,timeId:timeId(l),minuto:minuto(),periodo:pacote.jogo.periodoAtual});}replacar();salvar();render()}
function addCartao(l,tipo){let id=$("car_"+l).value,a=atletaPorId(id);if(!a)return alert("Selecione o atleta.");if(!a.numero)return alert("Informe o número da camisa.");pacote.jogo.cartoes.push({atletaId:a.id,atleta:a.nome,numero:a.numero,timeId:timeId(l),tipo,minuto:minuto(),periodo:pacote.jogo.periodoAtual});salvar();renderEventos()}
function replacar(){let j=pacote.jogo;j.placarCasa=j.gols.filter(g=>g.timeId===j.casa.timeId).length;j.placarFora=j.gols.filter(g=>g.timeId===j.fora.timeId).length}
function excluirEvento(tipo,i){if(!confirm("Excluir este registro?"))return;pacote.jogo[tipo].splice(i,1);if(tipo==="gols")replacar();salvar();render()}

function abrirModalEdicao(html){fecharModalEdicao();let b=document.createElement("div");b.id="modalEdicao";b.className="modal-edit-bg";b.innerHTML=`<div class="modal-edit">${html}</div>`;b.onclick=e=>{if(e.target===b)fecharModalEdicao()};document.body.appendChild(b)}
function fecharModalEdicao(){document.getElementById("modalEdicao")?.remove()}
function editarEvento(tipo,i,l){
 let j=pacote.jogo,arr=tipo==="gol"?j.gols:j.cartoes,e=arr[i],atletas=j[l].atletas||[];if(!e)return;
 let opts=atletas.map(a=>`<option value="${a.id}" ${e.atletaId===a.id?"selected":""}>#${esc(a.numero||"?")} — ${esc(a.nome)}</option>`).join("");
 if(tipo==="gol")abrirModalEdicao(`<h2>Editar gol</h2><label>Atleta</label><select id="eeAtleta"><option value="__GOL_CONTRA__" ${e.golContra?"selected":""}>⚽ GOL CONTRA</option>${opts}</select><label>Minuto</label><input id="eeMin" type="number" min="1" value="${e.minuto||1}"><label>Tempo</label><select id="eePer"><option value="1T" ${e.periodo!=="2T"?"selected":""}>1º Tempo</option><option value="2T" ${e.periodo==="2T"?"selected":""}>2º Tempo</option></select><div class="actions"><button class="light" onclick="fecharModalEdicao()">Cancelar</button><button class="green" onclick="salvarEventoEditado('gol',${i},'${l}')">Salvar</button></div>`);
 else abrirModalEdicao(`<h2>Editar cartão</h2><label>Atleta</label><select id="eeAtleta">${opts}</select><label>Cartão</label><select id="eeTipo"><option ${e.tipo==="Amarelo"?"selected":""}>Amarelo</option><option ${e.tipo==="Azul"?"selected":""}>Azul</option><option ${e.tipo==="Vermelho"?"selected":""}>Vermelho</option></select><label>Minuto</label><input id="eeMin" type="number" min="1" value="${e.minuto||1}"><label>Tempo</label><select id="eePer"><option value="1T" ${e.periodo!=="2T"?"selected":""}>1º Tempo</option><option value="2T" ${e.periodo==="2T"?"selected":""}>2º Tempo</option></select><div class="actions"><button class="light" onclick="fecharModalEdicao()">Cancelar</button><button class="green" onclick="salvarEventoEditado('cartao',${i},'${l}')">Salvar</button></div>`);
}
function salvarEventoEditado(tipo,i,l){
 let j=pacote.jogo,arr=tipo==="gol"?j.gols:j.cartoes,e=arr[i],v=$("eeAtleta").value;if(!e)return;
 if(tipo==="gol"&&v==="__GOL_CONTRA__"){e.golContra=true;e.atletaId=null;e.atleta="Gol contra";e.numero="";e.timeId=j[l].timeId}
 else{let a=(j[l].atletas||[]).find(x=>x.id===v);if(!a)return alert("Selecione um atleta.");e.golContra=false;e.atletaId=a.id;e.atleta=a.nome;e.numero=a.numero||"";e.timeId=j[l].timeId}
 if(tipo==="cartao")e.tipo=$("eeTipo").value;e.minuto=Math.max(1,parseInt($("eeMin").value,10)||1);e.periodo=$("eePer").value;
 if(tipo==="gol")replacar();salvar();fecharModalEdicao();render();
}
function lista(l){let a=pacote.jogo[l].atletas||[];return a.map(x=>`<div class="player"><input type="number" inputmode="numeric" min="0" placeholder="Nº" value="${esc(x.numero)}" onchange="mudarNumero('${x.id}',this.value)"><div><strong>${esc(x.nome)}</strong><small>Nasc.: ${esc(dataBR(x.nascimento))}</small></div></div>`).join("")||"<p>Sem atletas.</p>"}
function opts(l,gol=false){let base=`<option value="">Selecione...</option>`+(pacote.jogo[l].atletas||[]).slice().sort((a,b)=>(+a.numero||999)-(+b.numero||999)||a.nome.localeCompare(b.nome)).map(a=>`<option value="${a.id}">${a.numero?"#"+esc(a.numero)+" — ":""}${esc(a.nome)}</option>`).join("");return gol?base+`<option value="__GOL_CONTRA__">⚽ GOL CONTRA</option>`:base}
function painelEventos(l){let j=pacote.jogo,tid=timeId(l);let gs=j.gols.map((g,i)=>({...g,i})).filter(g=>g.timeId===tid),cs=j.cartoes.map((c,i)=>({...c,i})).filter(c=>c.timeId===tid);return `<hr><h3>Gol</h3><select id="gol_${l}">${opts(l,true)}</select><button class="green" style="width:100%;margin-top:7px" onclick="addGol('${l}')">+ Registrar gol</button><h3>Cartão</h3><select id="car_${l}">${opts(l)}</select><div class="eventbuttons" style="margin-top:7px"><button class="amber" onclick="addCartao('${l}','Amarelo')">Amarelo</button><button class="red" onclick="addCartao('${l}','Vermelho')">Vermelho</button></div><h3>Registros</h3>${gs.map(g=>`<div class="event"><span>⚽ ${g.golContra?"GOL CONTRA":("#"+esc(g.numero)+" "+esc(g.atleta))} — ${g.minuto}' ${g.periodo==='2T'?'2ºT':'1ºT'}</span><span><button class="light" onclick="editarEvento('gol',${g.i},'${l}')">Editar</button> <button class="red" onclick="excluirEvento('gols',${g.i})">X</button></span></div>`).join("")}${cs.map(c=>`<div class="event"><span>${c.tipo==="Vermelho"?"🟥":"🟨"} #${esc(c.numero)} ${esc(c.atleta)} — ${c.minuto}' ${c.periodo==='2T'?'2ºT':'1ºT'}</span><span><button class="light" onclick="editarEvento('cartao',${c.i},'${l}')">Editar</button> <button class="red" onclick="excluirEvento('cartoes',${c.i})">X</button></span></div>`).join("")||(!gs.length?"<small>Nenhum registro.</small>":"")}`}


function abrirDecisao(){
 let j=pacote.jogo,d=j.decisaoAdministrativa||{};
 abrirModalEdicao(`<h2>Decisão administrativa</h2><small>O placar e os gols permanecem inalterados. A decisão altera apenas a classificação no Gestor.</small><label>Equipe declarada vencedora</label><select id="admV"><option value="">Selecione...</option><option value="${j.casa.timeId}" ${d.vencedorTimeId===j.casa.timeId?"selected":""}>${esc(j.casa.nome)}</option><option value="${j.fora.timeId}" ${d.vencedorTimeId===j.fora.timeId?"selected":""}>${esc(j.fora.nome)}</option></select><label>Motivo</label><input id="admM" value="${esc(d.motivo||"Conduta inadequada da torcida")}"><label>Descrição</label><textarea id="admD">${esc(d.descricao||"")}</textarea><div class="actions"><button class="light" onclick="fecharModalEdicao()">Cancelar</button><button class="green" onclick="salvarDecisao()">Salvar</button></div>`);
}
function salvarDecisao(){let j=pacote.jogo,v=$("admV").value;if(!v)return alert("Selecione a equipe vencedora.");j.decisaoAdministrativa={vencedorTimeId:v,motivo:$("admM").value.trim(),descricao:$("admD").value.trim()};salvar();fecharModalEdicao();renderDecisao()}
function removerDecisao(){if(!confirm("Remover a decisão administrativa?"))return;delete pacote.jogo.decisaoAdministrativa;salvar();renderDecisao()}
function renderDecisao(){let el=$("decisaoArea");if(!el)return;let j=pacote.jogo,d=j.decisaoAdministrativa,n=d?.vencedorTimeId===j.casa.timeId?j.casa.nome:d?.vencedorTimeId===j.fora.timeId?j.fora.nome:"";el.innerHTML=`<h2>Decisão administrativa</h2>${n?`<div><strong>Vitória administrativa: ${esc(n)}</strong><br><small>${esc(d.motivo||"")} ${esc(d.descricao||"")}</small></div>`:"<small>Nenhuma decisão administrativa registrada.</small>"}<div class="actions"><button class="amber" onclick="abrirDecisao()">${n?"Editar decisão":"+ Registrar decisão"}</button>${n?`<button class="red" onclick="removerDecisao()">Remover</button>`:""}</div>`}
function renderTopo(){let j=pacote.jogo;$("meta").innerHTML=`<strong>${esc(pacote.campeonato?.nome||"Campeonato")}</strong><br>${esc(j.categoria)} • ${esc(j.rodada||"")} • ${esc(dataBR(j.data))} ${esc(j.hora||"")}<br>${esc(j.local?.nome||"")}`;$("casaNome").textContent=j.casa.nome;$("foraNome").textContent=j.fora.nome;$("pc").textContent=j.placarCasa||0;$("pf").textContent=j.placarFora||0;$("timer").textContent=fmt(segAtual());$("periodo").textContent=periodoTxt();$("btnPeriodo").textContent=pacote.jogo.periodoAtual==="1T"?"Encerrar 1º Tempo":"2º Tempo em andamento";$("btnPeriodo").disabled=pacote.jogo.periodoAtual==="2T"}
function renderEventos(){$("ec").innerHTML=painelEventos("casa");$("ef").innerHTML=painelEventos("fora")}
function render(){let j=pacote.jogo;renderTopo();$("hc").textContent=j.casa.nome;$("hf").textContent=j.fora.nome;$("lc").innerHTML=lista("casa");$("lf").innerHTML=lista("fora");renderEventos();renderDecisao();$("arb").value=j.responsaveisSumula.arbitro||"";$("mes").value=j.responsaveisSumula.mesario||"";$("rc").value=j.responsaveisSumula.responsavelCasa||"";$("rf").value=j.responsaveisSumula.responsavelFora||"";$("obs").value=j.observacoes||"";$("lrc").textContent="Responsável — "+j.casa.nome;$("lrf").textContent="Responsável — "+j.fora.nome}
function salvarCampos(){let r=pacote.jogo.responsaveisSumula;r.arbitro=$("arb").value;r.mesario=$("mes").value;r.responsavelCasa=$("rc").value;r.responsavelFora=$("rf").value;pacote.jogo.observacoes=$("obs").value;salvar()}
function baixar(obj,nome){let b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportar(encerrar){salvarCampos();pausar();let j=pacote.jogo;if(encerrar){j.status="Encerrado";j.encerradoEm=new Date().toISOString()}salvar();baixar(pacote,`retorno-mesario-${j.casa.nome}-x-${j.fora.nome}.json`)}
function finalizar(){if(!confirm("Encerrar a partida e gerar o arquivo para retornar ao Gestor?"))return;exportar(true)}
function limparTudo(){if(!confirm("Apagar a partida salva neste aparelho?"))return;localStorage.removeItem(KEY);location.reload()}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
</script></body></html>
